name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main # Если ваша ветка называется master, замените main на master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Раскомментируйте, если в проекте есть package.json и библиотеки:
      # - name: Install dependencies
      #   run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
