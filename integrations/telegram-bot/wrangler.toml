name = "visora-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Holds single-use state->chat_id entries for the /connect handshake
# (10 min TTL, set per-key in code). Create with:
#   npx wrangler kv namespace create CONNECT_STATE
[[kv_namespaces]]
binding = "CONNECT_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Not secrets — just current deployment URLs. Update these (and re-deploy)
# when the custom domain migration (main roadmap item 8) happens.
[vars]
VISORA_APP_URL = "https://app.visora.io"
VISORA_API_URL = "https://api.visora.io"

# Secrets — do NOT put these here. Set with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
