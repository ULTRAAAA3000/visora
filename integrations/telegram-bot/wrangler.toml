name = "visora-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Holds single-use state->chat_id entries for the /connect handshake
# (10 min TTL, set per-key in code). Create with:
#   npx wrangler kv namespace create CONNECT_STATE
[[kv_namespaces]]
binding = "CONNECT_STATE"
id = "4c5e62f8aad74d13982b7e9558a6877b"

# Not secrets — just current deployment URLs.
[vars]
VISORA_APP_URL = "https://visor-a.com"
VISORA_API_URL = "https://api.visor-a.com"

# Secrets — do NOT put these here. Set with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
