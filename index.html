<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Visora — Images your brand never gets wrong.</title>
    <meta
      name="description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />

    <!-- Open Graph / social previews. Update the og:url + twitter:site
         values once the custom domain migration happens. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Visora" />
    <meta property="og:title" content="Visora — Images your brand never gets wrong." />
    <meta
      property="og:description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />
    <meta property="og:url" content="https://visora-2kq.pages.dev/" />
    <meta property="og:image" content="https://visora-2kq.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Visora — Images your brand never gets wrong." />
    <meta
      name="twitter:description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />
    <meta name="twitter:image" content="https://visora-2kq.pages.dev/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
