<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://visor-a.com/" />

    <title>Visora — Images your brand never gets wrong.</title>
    <meta
      name="description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Visora" />
    <meta property="og:title" content="Visora — Images your brand never gets wrong." />
    <meta
      property="og:description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />
    <meta property="og:url" content="https://visor-a.com/" />
    <meta property="og:image" content="https://visor-a.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Visora — Images your brand never gets wrong." />
    <meta
      name="twitter:description"
      content="Turn HTML and Tailwind templates into OG images, product banners, and certificates — rendered by real Chromium, not a language model guessing at pixels."
    />
    <meta name="twitter:image" content="https://visor-a.com/og-image.png" />

    <!-- Structured data for search engines and AI answer engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Visora",
        "url": "https://visor-a.com/",
        "description": "API-first tool that turns HTML and Tailwind templates into images — OG images, product banners, certificates — rendered by real headless Chromium, not a language model guessing at pixels.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (API-based, no install required)",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD",
            "description": "500 renders/month, 1 API key"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "19",
            "priceCurrency": "USD",
            "description": "20,000 renders/month, 5 API keys, 4K output, webhooks"
          },
          {
            "@type": "Offer",
            "name": "Agency",
            "price": "49",
            "priceCurrency": "USD",
            "description": "100,000 renders/month, unlimited API keys, agency-exclusive templates, priority queue"
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Visora",
        "url": "https://visor-a.com/",
        "logo": "https://visor-a.com/apple-touch-icon.png",
        "email": "visora.image@gmail.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
